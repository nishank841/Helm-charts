name: Auto Merge PRs

on:
  pull_request:
    types: [labeled]

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'automerge' # Only merge PRs with your label
    steps:
      - uses: actions/checkout@v3
      - name: Enable Auto Merge
        uses: peter-evans/enable-pull-request-automerge@v2
        with:
          merge-method: squash
